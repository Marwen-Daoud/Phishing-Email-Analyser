<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Shield Shape -->
  <path d="M 32 4 L 54 12 C 54 36 42 52 32 60 C 22 52 10 36 10 12 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#shadow)"/>

  <!-- Inner Shield Highlight -->
  <path d="M 32 8 L 50 14.5 C 50 34 39.5 48 32 55 C 24.5 48 14 34 14 14.5 Z" 
        fill="none" 
        stroke="url(#glowGrad)" 
        stroke-width="1.5" 
        opacity="0.6"/>

  <!-- Mail Envelope Body -->
  <rect x="20" y="24" width="24" height="17" rx="3" fill="#ffffff" opacity="0.95"/>

  <!-- Envelope Flap -->
  <path d="M 20 25.5 L 32 34 L 44 25.5" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Magnifying / Security Radar Line -->
  <circle cx="32" cy="33.5" r="9" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <path d="M 28.5 33.5 L 31 36 L 36 30.5" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
